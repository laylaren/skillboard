name: typecheck
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # --ignore-scripts skips the root `prepare` hook (which runs the Vite/Rollup
      # web build). Type-checking with `tsc -b` doesn't need the built SPA, and
      # skipping it avoids Rollup's platform-specific native binary (npm/cli#4828).
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
